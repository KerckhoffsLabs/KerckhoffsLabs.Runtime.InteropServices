version: 2

# A cooldown lets a fresh release show its defects before it is adopted. Applied uniformly, it would
# also delay security fixes that ship without an advisory, which Dependabot cannot tell apart from an
# ordinary bump. So the wait is split: patch releases, where security fixes land and whose regressions
# are the cheapest to revert, wait one day; everything else waits a week.
#
# Each ecosystem has two groups. Without `applies-to`, a group covers version updates only and every
# security update arrives in a pull request of its own: one group takes the weekly bump, the other
# whatever security opens.
updates:
  # The library and its test project. They restore from packages.lock.json in locked mode, and
  # Dependabot updates the lock files with the version. They are listed by directory rather than
  # through KerckhoffsLabs.sln at the root so that tests/Integration stays out on purpose: it has no
  # package dependency of its own and, built on its own, floats (Version="*") on the package CI
  # packs into a local feed that does not exist here.
  - package-ecosystem: nuget
    directories:
      - /src/KerckhoffsLabs.Runtime.InteropServices
      - /tests/KerckhoffsLabs.Runtime.InteropServices.Tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 1
    open-pull-requests-limit: 10
    ignore:
      # Versioned with the SDK, and runs inside the build: it moves to the next major with the pinned SDK
      # (global.json), by hand.
      - dependency-name: Microsoft.SourceLink.GitHub
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        applies-to: version-updates
        patterns: ["*"]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # Workflows reference actions by tag and pin them in .github/workflows/actions.lock, which the
  # organization's "Require lockfile" policy enforces. A bump that leaves the lockfile behind is
  # blocked until it is regenerated: run `gh actions-lock` on the pull request's branch.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # semver-patch-days is not supported for github-actions.
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "ci"

# Deliberately not tracked: dotnet-sdk. global.json pins an exact SDK (rollForward: patch), which CI
# installs from it, because the lock files record that SDK's ILLink.Tasks; it is raised by hand, with
# the lock files regenerated in the same change.

name: code-quality

# CI-based SonarCloud analysis + Codecov coverage upload, sharing a single build and
# wide/narrow test pass. The SonarCloud half REPLACES SonarCloud's Automatic Analysis:
# disable it under Project > Administration > Analysis Method, or this scan is
# rejected (the two modes are mutually exclusive). Unlike Automatic Analysis,
# the SonarScanner for .NET sees the MSBuild graph and imports test coverage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    name: sonar
    # Not for runs Dependabot triggers: they get Dependabot secrets, not these, so SONAR_TOKEN and
    # CODECOV_TOKEN would be empty and the scan would fail. Keyed on who triggered the run, not who
    # opened the pull request: a maintainer's push to a Dependabot branch has the secrets and is
    # analysed as usual.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The scanner reads the token from SONAR_TOKEN; pass it via the environment rather
    # than expanding the secret inside a run block, where it can leak (githubactions:S7636).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Sonar needs full history for new-code detection and blame

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402' # exact SDK: the lock files record its ILLink.Tasks (see the library's .csproj)

      # The Sonar analysis engine is JVM-based; the .NET scanner shells out to it.
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Pinned deliberately. Unpinned, `dotnet tool install` takes whatever is latest on the day
      # the job runs, so the scanner — and the analyzers it embeds — can change with no commit to
      # point at. That is how the "problems with file encoding in the source code" warning arrived
      # (a newer XML sensor began sniffing non-source files); a floating analysis tool makes CI
      # results non-reproducible and turns analyzer changes into surprises on unrelated PRs.
      # Bump this the way the lockfile-pinned actions above are bumped: deliberately, in its own commit.
      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner --version 12.0.0

      - name: Restore
        run: dotnet restore src/KerckhoffsLabs.sln --locked-mode

      # sonar.sourceEncoding is explicit because the scanner otherwise assumes the runner's default
      # charset, which is not guaranteed to be UTF-8 and mis-decodes every source file containing a
      # non-ASCII character (the em dashes and arrows in the doc comments). The repository is UTF-8 by
      # construction — .editorconfig sets charset = utf-8 and the dotnet format gate enforces it — so
      # this only tells the scanner what the files already are.
      #
      # docs/ is excluded: it is the DocFX site (Markdown, templates and binary images), none of it
      # library code.
      #
      # The tests are excluded under both keys because the scanner sorts them two ways: the Tests
      # project is detected as a test project, so its files are test sources filtered by
      # sonar.test.exclusions, while tests/Integration is an ordinary executable (outside the solution
      # the scan builds today) whose files would be main sources filtered by sonar.exclusions.
      # Excluding only one key leaves the other half analyzed.
      #
      # reportsPaths has a wildcard segment in the filename itself (coverage.opencover.*.xml, not a
      # literal coverage.opencover.xml): coverlet.MTP names its output coverage.opencover.<id>.xml.
      # A literal-filename glob silently matches nothing -- the scanner logs a WARN and imports
      # zero coverage while the analysis still "succeeds". The Codecov "files:" glob below needs
      # the same treatment for coverage.cobertura.*.xml.
      #
      # githubactions:S7637 wants every third-party `uses:` pinned to a commit SHA inline. The
      # workflows are pinned by .github/workflows/actions.lock instead, which Actions enforces at
      # run time (transitive dependencies included); Sonar does not read the lockfile, so it
      # flags every tag ref. Ignored for workflow files only: the organization's "Require lockfile"
      # Actions policy blocks any workflow whose dependencies are not in the lockfile.
      - name: Begin analysis
        run: >
          dotnet sonarscanner begin
          /k:"KerckhoffsLabs_KerckhoffsLabs.Runtime.InteropServices"
          /o:"kerckhoffslabs"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.sourceEncoding="UTF-8"
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.*.xml"
          /d:sonar.exclusions="docs/**,tests/**,src/KerckhoffsLabs.Runtime.InteropServices.Tests/**"
          /d:sonar.test.exclusions="tests/**,src/KerckhoffsLabs.Runtime.InteropServices.Tests/**"
          /d:sonar.issue.ignore.multicriteria="actionslock"
          /d:sonar.issue.ignore.multicriteria.actionslock.ruleKey="githubactions:S7637"
          /d:sonar.issue.ignore.multicriteria.actionslock.resourceKey=".github/workflows/*.yml"

      - name: Build
        run: dotnet build src/KerckhoffsLabs.sln --no-restore -c Release -p:UseMicrosoftTestingPlatformRunner=true

      # Cover both NativeCULong layouts so Sonar sees the #if WINDOWS branch too: the
      # wide (nuint) build reuses the Build above; the narrow (uint) build is selected
      # by $(NativeCULongNarrow) and rebuilt here. Each run emits BOTH coverage formats
      # in a single pass — OpenCover (Sonar's first-class .NET format, imported by the
      # begin-step glob) and Cobertura (uploaded to Codecov below) — so the test suite
      # is built and executed once instead of duplicated across a separate workflow.
      - name: Test with coverage (wide / nuint)
        run: >
          dotnet test --solution src/KerckhoffsLabs.sln --no-build -c Release
          --results-directory ./coverage --output Detailed
          -- --coverlet --coverlet-output-format opencover --coverlet-output-format cobertura

      - name: Test with coverage (narrow / uint)
        run: >
          dotnet test --solution src/KerckhoffsLabs.sln --no-restore -c Release -p:NativeCULongNarrow=true
          -p:UseMicrosoftTestingPlatformRunner=true
          --results-directory ./coverage --output Detailed
          -- --coverlet --coverlet-output-format opencover --coverlet-output-format cobertura

      # Upload the Cobertura reports to Codecov. Push-only to preserve the previous
      # coverage workflow's trigger (and to avoid touching fork PRs, where the token is
      # unavailable). Runs before End analysis so a Codecov hiccup is independent of the
      # Sonar import.
      - name: Upload coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage/**/coverage.cobertura.*.xml
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: End analysis
        run: dotnet sonarscanner end

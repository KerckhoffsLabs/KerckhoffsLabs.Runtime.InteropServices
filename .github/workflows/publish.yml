name: Publish

on:
  push:
    tags: ['v*']

# Pushing a v* tag releases: this workflow publishes the package to NuGet, then creates the GitHub
# release with the attested packages attached. Don't create the release by hand first: releases are
# immutable, so one already published can't take the packages and the release job fails.
#
# None by default: each job declares what it needs (publish: contents read, id-token and attestations
# write; release: contents write; docs-build: contents and pages read; docs-deploy: pages and id-token
# write), and a job added later starts with no token permissions until it asks.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing
      attestations: write  # required for attest-build-provenance

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # required to resolve the tag ref

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402' # exact SDK: the lock files record its ILLink.Tasks (see the library's .csproj)

      # Derive the version from the tag once so the build stamps it into the
      # assembly (AssemblyVersion/FileVersion/InformationalVersion), not just the
      # package. The --no-build pack below then reuses the versioned assemblies.
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet restore src/KerckhoffsLabs.sln --locked-mode

      - run: dotnet build src/KerckhoffsLabs.sln --no-restore -c Release /p:Version=$VERSION

      - run: dotnet test --solution src/KerckhoffsLabs.sln --no-build -c Release

      - name: Pack
        run: dotnet pack src/KerckhoffsLabs.Runtime.InteropServices/KerckhoffsLabs.Runtime.InteropServices.csproj --no-build -c Release -o ./artifacts /p:Version=$VERSION

      # nuget.org signs each package it accepts by adding .signature.p7s to it, so the .nupkg users
      # download no longer has the digest attested here. That signature leaves the assemblies inside
      # unchanged: attesting them too lets a package from nuget.org be checked file by file, and the
      # release job attaches the attested packages themselves to the GitHub release.
      - name: Extract the packaged assemblies
        run: |
          for package in ./artifacts/*.nupkg; do
            destination="./artifacts/contents/$(basename "$package" .nupkg)"
            mkdir -p "$destination"
            unzip -q "$package" '*.dll' -d "$destination"
          done

      - uses: actions/attest-build-provenance@v4.2.2
        id: provenance
        with:
          subject-path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/contents/**/*.dll

      # The signed provenance as a file, for the release job to attach: verifiable offline with
      # `gh attestation verify <file> --bundle <bundle>`, and what OpenSSF Scorecard's Signed-Releases
      # check looks for, since it recognizes release assets by name and doesn't read GitHub's
      # attestation store (ossf/scorecard#4667). The bundle is one line of JSON, so .intoto.jsonl
      # holds.
      - name: Keep the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "./artifacts/KerckhoffsLabs.Runtime.InteropServices.$VERSION.intoto.jsonl"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/*.intoto.jsonl
          if-no-files-found: error
          retention-days: 7

      - name: NuGet login (OIDC)
        uses: nuget/login@v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

  # Separate from publish so that contents: write is never held by the job that builds and runs the
  # tests. Runs only once the push to NuGet succeeded.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the release and attach the packages and their provenance

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: packages
          path: ./artifacts

      # With assets given, gh creates the release as a draft, uploads them, then publishes it, so the
      # packages and their provenance are in place before the release becomes immutable.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg ./artifacts/*.snupkg ./artifacts/*.intoto.jsonl --verify-tag --generate-notes

  # Refresh the DocFX API-reference site on GitHub Pages as part of each release.
  # Pages must already be enabled with "GitHub Actions" as the source (Settings ->
  # Pages); the initial deploy was seeded once by the docs-bootstrap workflow.
  docs-build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read   # checkout
      pages: read      # configure-pages reads the site config
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402' # exact SDK: the lock files record its ILLink.Tasks (see the library's .csproj)

      # Pinned for the same reason as the scanner in code-quality.yml: an unpinned tool floats to
      # latest per run. It matters more here — this job runs only on release tags and builds with
      # --warningsAsErrors, so a docfx change that emits a new warning would first surface as a
      # failed release rather than as a failed PR.
      - name: Install docfx
        run: dotnet tool install --global docfx --version 2.78.5

      - name: Build documentation (metadata + site)
        run: docfx docs/docfx.json --warningsAsErrors

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/_site

  docs-deploy:
    name: Deploy docs to GitHub Pages
    needs: docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize Pages deployments across workflows; don't cancel an in-flight publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write     # deploy-pages publishes the artifact
      id-token: write  # deploy-pages authenticates to the Pages API via OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
